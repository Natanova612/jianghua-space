<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 个人名章 v2：白文方篆「華」，朱砂红 #c8391f -->
  <!-- 外框：略带手刻感的不规则方印 -->
  <path d="M6 5.5
           C5 5.5 4 6.5 4 8
           L4.2 56
           C4.2 57.8 5.6 59.4 7.4 59.4
           L56.5 59.6
           C58.3 59.6 59.8 58.1 59.8 56.3
           L59.6 7.8
           C59.6 6.2 58.4 5.5 56.8 5.5 Z"
        fill="#c8391f"/>
  <!-- 内白框 -->
  <rect x="8.5" y="8.5" width="47" height="47" rx="2"
        fill="none" stroke="#f7f3ec" stroke-width="1.6"/>
  <!-- 方篆「華」：几何化笔画，直角折转 -->
  <g stroke="#f7f3ec" stroke-width="3.1" fill="none" stroke-linecap="square">
    <!-- 艹头：一横两竖 -->
    <path d="M18 16.5 H46"/>
    <path d="M24 12.5 V20"/>
    <path d="M40 12.5 V20"/>
    <!-- 中横（两端下折，取九叠篆意） -->
    <path d="M14.5 25.5 V22 H49.5 V25.5"/>
    <!-- 口 -->
    <path d="M25 25.5 H39 V31.5 H25 Z"/>
    <!-- 下横一 -->
    <path d="M17 36 H47"/>
    <!-- 下横二 -->
    <path d="M18 42 H46"/>
    <!-- 中竖（穿两横到底） -->
    <path d="M32 31.5 V52"/>
  </g>
</svg>
